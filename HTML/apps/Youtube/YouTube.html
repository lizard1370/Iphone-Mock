<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iphone Mock | YouTube</title>
  <link rel="stylesheet" href="/Iphone-Mock/CSS/YouTube.css">
</head>
<body>
<button id="rotateBtn">↻ Rotate Phone</button>
    <div class="phone-rotate-wrapper">
    <div class="box">
        <div class="inner-home">
            <div class="island_popup">
                <div class="content">
                    <div class="detais">
                        <p>Kevin is calling</p>
                    </div>
                    <div class="action">
                        <ion-icon name="call" class="red"></ion-icon>
                        <ion-icon name="call" class="green"></ion-icon>
                    </div>
                </div>
            </div>

            <div class="yt-tabs">
                <button class="tab-btn active" data-tab="feed">Feed</button>
                <button class="tab-btn" data-tab="upload">Upload</button>
                <button class="tab-btn" data-tab="library">Library</button>
            </div>

            <div id="feed" class="tab-content active">
                <div class="video-feed">
                </div>
                <div class="empty-feed">No videos yet. Upload one to get started!</div>
            </div>

            <div id="upload" class="tab-content">
                <div class="upload-container">
                    <div class="upload-form">
                        <h2>Upload Video</h2>
                        <div class="form-group">
                            <label>Video Title</label>
                            <input type="text" id="videoTitle" placeholder="Enter title" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="videoDesc" placeholder="Describe your video" maxlength="200"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Video File (MP4)</label>
                            <input type="file" id="videoFile" accept="video/mp4">
                            <small>Max 50MB</small>
                        </div>
                        <div class="form-group">
                            <label>Thumbnail</label>
                            <input type="file" id="thumbnail" accept="image/*">
                        </div>
                        <button id="uploadBtn" class="upload-submit">Upload Video</button>
                        <div id="uploadStatus" class="upload-status"></div>
                    </div>
                </div>
            </div>

            <div id="library" class="tab-content">
                <div class="library-container">
                    <h2>Your Videos</h2>
                    <div class="library-list">
                    </div>
                    <div class="empty-library">No videos uploaded yet</div>
                </div>
            </div>

            <div id="playerModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <video id="videoPlayer" controls></video>
                    <div class="video-info">
                        <h3 id="playerTitle"></h3>
                        <p id="playerDesc"></p>
                        <div class="video-stats">
                            <span id="viewCount">0 views</span>
                            <span id="uploadDate"></span>
                        </div>
                        <button id="likeBtn" class="like-btn">👍 Like</button>
                    </div>
                </div>
            </div>

            <div class="island_bottom" onclick="openApp('/Iphone-Mock/HTML/home.html')">
                <a href="/Iphone-Mock/HTML/home.html" id="editBtn" class="content2"></a>
            </div>
        </div>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/Iphone-Mock/JS/YouTube.js"></script>
</body>
</html>
